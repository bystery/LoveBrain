# Release 自动构建工作流
# 触发：推送 v* 格式 tag（如 v1.3.0, v1.4.0-rc1）
# 产物：正式签名 assembleRelease APK 自动上传到对应 GitHub Release，并自动生成 Release Notes
#
# 签名说明：
#   CI 通过 GitHub Secrets 注入 keystore（KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
#   KEY_ALIAS / KEY_PASSWORD），解码后写入 keystore.properties，build.gradle.kts 读取并签名。
#   缺少任一 secret 时 workflow 直接失败，绝不 fallback 到 debug 签名。
#   本地没有 keystore.properties 时 build.gradle.kts 产出 unsigned release APK（仅供 R8/CI 验证）。
#
# 质量门禁：
#   - 发布 job 依赖同 SHA 的 CI verify + ui-test 全部成功
#   - 构建前校验 tag == v${versionName}，RC tag 标记为 pre-release
#   - 跑 unit + lint + R8 后才允许创建 Release

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # 发布 job 必须依赖同一 commit SHA 的全部 CI 成功（verify + ui-test）
  wait-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI verify to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'verify'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Wait for CI ui-test to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'ui-test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  build:
    needs: wait-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 校验 tag 与 versionName 一致；RC tag 标记为 pre-release
      - name: Verify tag matches versionName
        id: tagcheck
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/')
          echo "Tag: $TAG_NAME, versionName: v$VERSION_NAME"
          if [ "$TAG_NAME" != "v$VERSION_NAME" ]; then
            echo "ERROR: Tag $TAG_NAME does not match versionName v$VERSION_NAME"
            exit 1
          fi
          if echo "$TAG_NAME" | grep -q '\-rc'; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "RC tag detected — will create as pre-release"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=../keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK with version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LoveBrain-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compute APK SHA-256
        run: |
          cd dist
          sha256sum LoveBrain-*.apk > SHA256.txt
          cat SHA256.txt

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LoveBrain-*.apk
            dist/SHA256.txt
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          prerelease: ${{ steps.tagcheck.outputs.IS_PRERELEASE == 'true' }}
