name: CI

# 精简 2026-10-07（发布收口）：push CI 只留质量底线——unit test + lint +
# androidTest 编译检查 + 协程取消静态护栏。
# 删掉的慢件（R8 构建 / 模拟器 ui-test / APK 元数据）：
#   · R8 assembleRelease 与 APK 元数据校验移到 release.yml 的本地手动流程
#     （签名 APK 不在 CI 内，R8 产物在 push 里只验"能编"不验"能发"——那一步
#     本来就在 release.yml 由人本地跑 `assembleRelease` + 签名后交回证据）。
#   · ui-test（emulator）移到 .github/workflows/manual.yml（workflow_dispatch）。
#     release.yml 的 --require-job ui-test 改为不要求 push job（签名/覆盖安装
#     已是本地动作，push 那一发里 emulator 天然 skipped 不再报红）。
# 保留：unit test（秒级、防真崩溃）、lint（质量底线）、androidTest 编译（防
# 双重遮蔽）、协程取消审计（秒级、防真崩溃）。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/lib/*.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Instrumentation sources must compile (same SHA, same job)
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

      - name: Cancellation-hygiene audit must be clean
        run: python3 scripts/audit_cancellation.py --check

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30
