name: CI

# Re-audit 2026-09-23 §3/§8: every step in this file must be able to turn the
# build red. Nothing below may swallow a failure: the audited workflow masked
# failed downloads, failed installs and found crashes with permissive flags.
#
# All multi-line shell lives in scripts/ so it can be run and reviewed
# locally; the YAML only calls those scripts.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/lib/*.sh

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assert unit test evidence is real
        # An empty/absent XML result set is a failure, not a warning.
        run: bash scripts/assert_artifacts.sh --label "unit" --min-tests auto --xml-dir app/build/test-results/testDebugUnitTest --html-dir app/build/reports/tests/testDebugUnitTest

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assert lint actually ran
        # The lint report is not a JUnit XML, so it needs its own evidence mode:
        # non-empty, a parseable <issues> root, at least one issue element, no
        # Fatal severity and a non-stub HTML companion.
        run: bash scripts/assert_artifacts.sh --label "lint" --lint-xml app/build/reports/lint-results-debug.xml --lint-html app/build/reports/lint-results-debug.html

      - name: Instrumentation sources must compile (same SHA, same job)
        # ui-test 过去在 Gradle 之前就退出，androidTest 的编译问题会被双重遮蔽；
        # 这里显式编一遍，编译不过就当场红，不等 emulator。
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon

      - name: Prompt asset lock must not have drifted
        # BENCHMARK.md quotes a real SHA-256 of the prompt assets; this is what
        # keeps that quote honest instead of decorative.
        run: bash scripts/asset_hashes.sh --check docs/prompt-assets.lock

      - name: Cancellation-hygiene audit must be clean
        # 复核报告 §6 S2-07 最后一条要求"全仓 CancellationException 审计结果 + lint/static rule 防回归"。
        # 这条就是那条静态规则：协程可挂起处吞掉 Exception/Throwable 而未放行取消信号 = 直接红。
        run: python3 scripts/audit_cancellation.py --check

      - name: Production code must not carry ticket ids
        # 复核报告 §6 S2-07："历史工单编号和补丁说明仍广泛留在生产代码"。
        # 注释、代码与字符串字面量三处都要为 0，防止编号再次回流到 src/main。
        run: python3 scripts/strip_ticket_ids.py --check

      - name: Upload cancellation audit result
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-audit
          path: docs/CANCELLATION-AUDIT.md
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30

      - name: Release R8 build
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Resolve the release artifact this job produced
        # The verify job has no release keystore on purpose: it proves R8 + the
        # APK shape, and must not be mistaken for a shippable candidate. The name
        # of the produced file depends on that, so it is resolved, not guessed.
        run: |
          bash scripts/resolve_release_apk.sh --allow-unsigned \
            --path-file dist/release-apk-path.txt

      - name: Verify APK metadata (SHA-256 / versionCode / versionName / package)
        run: |
          bash scripts/check_apk_metadata.sh \
            "$(cat dist/release-apk-path.txt)" \
            --expected-package com.lovebrain.app \
            --expect-release \
            --r8-mapping app/build/outputs/mapping/release/mapping.txt \
            --properties dist/apk-metadata.txt \
            --report dist/apk-metadata.md

      - name: Suggest cost-baseline harness (offline parts)
        # The real N-request cost baseline needs an operator-supplied key, so CI
        # runs only what it can honestly prove: the frozen fixture, the request
        # construction and the metric maths. No usage/cost number is invented here.
        run: |
          bash scripts/suggest_cost_baseline.sh --self-test
          bash scripts/suggest_cost_baseline.sh --requests 3 --dry-run --tag ci-dry-run

      - name: Upload suggest-baseline dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suggest-baseline-dry-run
          path: dist/suggest-baseline/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency license scan and SBOM
        # Replaces the audited dependency dump, which was piped through a permissive
        # fallback so it could never fail — and was neither a license scan nor an SBOM.
        run: |
          bash scripts/license_scan.sh \
            --configuration releaseRuntimeClasspath \
            --policy scripts/license-policy.txt \
            --overrides scripts/license-overrides.txt \
            --spdx dist/sbom.spdx.json \
            --csv dist/dependency-licenses.csv \
            --report dist/dependency-license-report.md

      - name: Upload SBOM and license evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            dist/sbom.spdx.json
            dist/dependency-licenses.csv
            dist/dependency-license-report.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK checksum and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-metadata
          path: dist/apk-metadata.*
          if-no-files-found: error
          retention-days: 90

      # 无签名的 assembleRelease 产物命名为 unsigned-r8-check-apk，不能叫 release-apk
      - name: Upload unsigned R8 check APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-r8-check-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

  # UI 测试属于最终质量门禁——失败必须使 CI 红灯。
  # emulator 偶发问题通过 scripts/run_ui_tests.sh 的 retry 处理，
  # 不得用放行标志掩盖。
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: |
            chmod +x gradlew scripts/*.sh scripts/lib/*.sh
            bash scripts/run_ui_tests.sh --attempts 2 --min-tests auto
          disable-animations: true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-screenshots
          path: app/build/outputs/connected_android_test_additional_output/
          retention-days: 30

      - name: Upload test XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-xml-report
          path: |
            app/build/outputs/androidTest-results/connected/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**/*.xml
          retention-days: 30
          if-no-files-found: error

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            /tmp/logcat*.txt
            app/build/outputs/androidTest-results/connected/
          retention-days: 7

  # P3-07: 升级安装测试——下载并校验 v1.3.1、安装旧版、真实写夹具、
  # 覆盖安装**签名/R8 Release** 候选、断言数据可读 + schema 已升级 + 主页面可用。
  upgrade-test:
    runs-on: ubuntu-latest
    # UI 已经红的时候不该再造一套"看起来通过"的升级结果
    needs: [verify, ui-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Require the release signing secrets
        # An upgrade gate on an UNSIGNED candidate proves nothing about the artifact
        # users will actually receive, so this job fails loudly instead of falling
        # back to assembleDebug (the audited behaviour) or skipping.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/prepare_release_keystore.sh --baseline scripts/signing-baseline.txt

      - name: Build candidate release APK (signed + R8)
        # keystore.properties was just materialised, so :app:assembleRelease now
        # emits the signed app-release.apk — the same artifact class Release publishes.
        run: |
          chmod +x gradlew scripts/*.sh scripts/lib/*.sh
          ./gradlew :app:assembleRelease --no-daemon
          bash scripts/resolve_release_apk.sh --require-signed --path-file fixtures/candidate-apk-path.txt

      - name: Download and verify v1.3.1 fixture APK
        # A failed download is a hard failure. The previous version of this step
        # swallowed the failure and marked the whole upgrade gate as skipped.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/download_release_apk.sh v1.3.1 fixtures \
            --repo "$GITHUB_REPOSITORY" \
            --path-file fixtures/old-apk-path.txt

      - name: Upgrade install, fixture write and smoke test
        # `default`/google_apis image: scripts/write_upgrade_fixture.sh needs a root
        # adb shell because the candidate is a NON-debuggable release APK, so run-as
        # cannot reach /data/data/<pkg>. A playstore image would fail loudly there.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          script: |
            bash scripts/run_upgrade_test.sh \
              --old-apk "$(cat fixtures/old-apk-path.txt)" \
              --candidate-apk "$(cat fixtures/candidate-apk-path.txt)" \
              --out-dir fixtures
          disable-animations: true

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence
          path: fixtures/
          if-no-files-found: error
          retention-days: 30
