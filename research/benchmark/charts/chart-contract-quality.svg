<text x="24" y="500" font-size="11" fill="#555555">样本：4 臂 × 40 集 × 12 轮 = 1,968 个 scoring.json（逐臂恰 492 轮，脚本核验）；同一实验同模型 deepseek-flash-2（2026-11-10）。</text>
<text x="24" y="516" font-size="11" fill="#555555">DIRECT/COT 为纯文本直接基线，不实现结构化协议——低合规率是协议层有效拦截的证据，不构成同机制公平对比。</text>
<text x="24" y="532" font-size="11" fill="#555555">同机制对比：LEGACY → CURRENT 违例与否决 2 项 → 0 项（违例与否决同为同一轮：越权拒答且 schema 不合规）。</text>
<text x="24" y="548" font-size="11" fill="#555555">复评层交叉印证：universal_scorer 轻量契约 1,954 轮中仅 COT/LEGACY 各 1 轮失败，与层 1 结论一致。</text>
<text x="24" y="564" font-size="11" fill="#555555">详见 research/BENCHMARK_EVALUATION.md 第5节（四臂实验）。</text>
<text x="24" y="584" font-size="10.5" fill="#888888">脚本：research/benchmark/charts/generate_selection_charts.py（纯标准库）· 复跑：python -I research/benchmark/charts/generate_selection_charts.py</text>
