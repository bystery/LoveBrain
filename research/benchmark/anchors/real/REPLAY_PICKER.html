.mark{padding:2px 9px;border-radius:999px;font-weight:600}
.mark.yes{background:#e6f7ee;color:var(--ok)}
.mark.no{background:#f0f2f5;color:var(--muted)}

.ctx .fold{display:none}
.ctx.open .fold{display:inline}

.reply{font-size:17px;line-height:1.7;margin:10px 0;padding:10px 12px;background:#f7f9ff;border-radius:8px;white-space:pre-wrap}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px;font-weight:600;user-select:none}
.pick input{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
.card.checked .pick{color:var(--ok)}
.note{flex:1;min-width:200px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink)}
.note:focus{outline:none;border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
</style>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items;
const LS_KEY = 'replay_picker_v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { state = {}; }

const st = { filter:'all', style:'all', src:'all' };
const FILTERS = [['all','全部'],['checked','已勾'],['unchecked','未勾'],['sent','已发送'],['unsent','未发送']];
const styles = [...new Set(ITEMS.map(i=>i.style))].sort();
const srcs = [...new Set(ITEMS.map(i=>i.src))].sort();

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function buildToolbar(){
  const bar = document.getElementById('filters');
  bar.innerHTML = '';
  FILTERS.forEach(([k,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = st.filter===k ? 'active' : '';
    b.onclick = ()=>{ st.filter=k; buildToolbar(); render(); };
    bar.appendChild(b);
  });
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="all">全部风格</option>' + styles.map(s=>`<option value="${s}">风格：${s}</option>`).join('');
  sel.value = st.style;
  sel.onchange = ()=>{ st.style = sel.value; render(); };
  bar.appendChild(sel);
  const sel2 = document.createElement('select');
  sel2.innerHTML = '<option value="all">全部快照</option>' + srcs.map(s=>`<option value="${s}">${s.replace('.zip','')}</option>`).join('');
  sel2.value = st.src;
  sel2.onchange = ()=>{ st.src = sel2.value; render(); };
  bar.appendChild(sel2);
  const sp = document.createElement('div'); sp.className='spacer'; bar.appendChild(sp);
  const exp = document.createElement('button');
  exp.textContent = '导出 JSON';
  exp.onclick = exportJSON;
  bar.appendChild(exp);
  const clr = document.createElement('button');
  clr.textContent = '清空全部勾选';
  clr.className = 'danger';
  clr.onclick = ()=>{
    if(confirm('确定清空全部勾选和备注吗？此操作不可恢复。')){
      state = {}; save(); render();
    }
  };
  bar.appendChild(clr);
}

function visible(){
  return ITEMS.filter(it=>{
    const rec = state[it.id] || {};
    if(st.filter==='checked' && !rec.c) return false;
    if(st.filter==='unchecked' && rec.c) return false;
    if(st.filter==='sent' && !it.sent) return false;
    if(st.filter==='unsent' && it.sent) return false;
    if(st.style!=='all' && it.style!==st.style) return false;
    if(st.src!=='all' && it.src!==st.src) return false;
    return true;
  });
}

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

function render(){
  const list = document.getElementById('list');
  const vis = visible();
  document.getElementById('total').textContent = ITEMS.length;
  document.getElementById('cnt').textContent = ITEMS.filter(i=>(state[i.id]||{}).c).length;
  if(!vis.length){ list.innerHTML = '<div class="empty">当前筛选条件下没有条目</div>'; return; }
  list.innerHTML = vis.map(it=>{
    const rec = state[it.id] || {};
    const ctxLines = (it.context||[]).map(c=>`<div><span class="who">${esc(c.who)}：</span>${esc(c.text)}</div>`).join('');
    const needFold = (it.context||[]).length > 6;
    const ctxHtml = ctxLines ? `<div class="ctx ${needFold?'':'open'}" id="ctx_${it.id}">${ctxLines}</div>${needFold?`<span class="ctx-toggle" onclick="document.getElementById('ctx_${it.id}').classList.toggle('open');this.textContent=this.textContent.includes('展开')?'收起 ▲':'展开 ▼'">展开 ▼</span>`:''}` : '';
    return `<div class="card ${rec.c?'checked':''}" id="card_${it.id}">
      <div class="meta">
        <span class="ts">${esc(it.timestamp)}</span>
        ${it.plan?`<span class="badge">${esc('方案'+it.plan+' · ')}${esc(it.style)}</span>`:`<span class="badge">${esc(it.style)}</span>`}
        ${it.sent?'<span class="badge sent">已发送</span>':'<span class="mark no">未发送</span>'}
        ${it.topic?`<span class="tag">${esc(it.topic)}</span>`:''}
        <span class="tag">${esc((it.src||'').replace('.zip',''))}</span>
      </div>
      ${ctxHtml}
      <div class="reply">${esc(it.reply)}</div>
      <div class="foot">
        <label class="pick"><input type="checkbox" data-id="${it.id}" ${rec.c?'checked':''}> 写得好</label>
        <input class="note" placeholder="备注（可不填）" data-id="${it.id}" value="${esc(rec.n||'')}">
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.id;
      const rec = state[id] = state[id] || {c:false,n:''};
      rec.c = cb.checked;
      if(!rec.c && !rec.n) delete state[id];
      save();
      document.getElementById('card_'+id).classList.toggle('checked', cb.checked);
      document.getElementById('cnt').textContent = ITEMS.filter(i=>(state[i.id]||{}).c).length;
    };
  });
  list.querySelectorAll('.note').forEach(inp=>{
    inp.oninput = ()=>{
      const id = inp.dataset.id;
      const rec = state[id] = state[id] || {c:false,n:''};
      rec.n = inp.value;
      if(!rec.c && !rec.n) delete state[id];
      save();
    };
  });
}

function exportJSON(){
  const items = ITEMS.filter(i=>(state[i.id]||{}).c).map(i=>({
    id: i.id, timestamp: i.timestamp, topic: i.topic||'', sent: i.sent,
    context: i.context||[], reply: i.reply, style: i.style, note: (state[i.id].n||'')
  }));
  const payload = { source: DATA.source, exported_at: new Date().toISOString(), items };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'anchors_selected.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

buildToolbar();
render();
</script>
