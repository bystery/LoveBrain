<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
<title id="title">LoveBrain 研究成绩：25–32 轮长程记忆保持率 1.0、跨域四场景保持 1.0×4、严重事实错误 6 降至 1、整组盲评 11:1</title>
<desc id="desc">长程记忆与旧滑窗父本同批同判据比较；跨域四场景保持 1.0，旧机制 32.3%–62.4%（对照 r9_slim）；严重错误 6→1（对照同批父本）；整组盲评 11 胜 1 负（vs 普通基线，代理评分，多候选 12 组）。各项属于不同实验。</desc>
